<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bringo — Kéz- és Lábápolás</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="bringo-tokens.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />
</head>
<body class="bg-cream-300 font-body text-olive-800 min-h-screen">

  <!-- ── Hero ── -->
  <section class="relative min-h-screen flex items-center overflow-hidden">

    <!-- Decorative blobs -->
    <div class="absolute top-0 right-0 w-[36rem] h-[36rem] bg-olive-200 rounded-full -translate-y-1/2 translate-x-1/3 opacity-50 pointer-events-none"></div>
    <div class="absolute bottom-0 left-0 w-80 h-80 bg-gold-200 rounded-full translate-y-1/2 -translate-x-1/3 opacity-40 pointer-events-none"></div>
    <div class="absolute bottom-1/3 right-10 w-40 h-40 bg-cream-400 rounded-full opacity-30 pointer-events-none"></div>

    <div class="relative max-w-5xl mx-auto px-8 md:px-16 py-24">

      <!-- Badge -->
      <span class="inline-block bg-olive-200 text-olive-700 text-xs font-medium px-4 py-1.5 rounded-pill mb-8 uppercase tracking-widest">
        ✦ Keszthely · Időpontot vár
      </span>

      <!-- Signature title -->
      <p class="font-signature text-gold-gradient-v mb-3" style="font-size: clamp(2.8rem, 6vw, 5rem); line-height: 1.1;">
        Kéz- és Lábápolás, műkörömépítés
      </p>

      <!-- Display headline -->
      <h1 class="font-display font-semibold text-olive-800 leading-tight mb-6" style="font-size: clamp(2.5rem, 5vw, 4rem);">
        Szépség,<br/>
        <span class="text-gold-gradient-v italic">amit érzel.</span>
      </h1>

      <!-- Body copy -->
      <p class="font-body text-base text-olive-700 leading-relaxed mb-10 max-w-md">
        Professzionális manikűr és műköröm-szolgáltatások, ahol minden részlet számít. Foglalj időpontot még ma!
      </p>

      <!-- CTAs -->
      <div class="flex flex-wrap gap-4">
        <button class="bg-olive-200 hover:bg-olive-300 text-olive-800 font-medium px-8 py-4 rounded-pill shadow-soft hover:shadow-card transition-all duration-200 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5"/>
          </svg>
          Időpontot foglalok
        </button>
        <button class="border-2 border-gold-300 text-gold-600 hover:bg-gold-100 font-medium px-8 py-4 rounded-pill transition-all duration-200">
          Szolgáltatások
        </button>
      </div>

    </div>
  </section>

</body>
</html>
